services:
  - type: web
    name: wordbook
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASS
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_SSL
        value: "true"
